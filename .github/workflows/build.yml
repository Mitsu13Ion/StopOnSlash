name: Build Windows DLL
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ee12231b20c95013c6638d845d04c91559a1d1ff
      - name: Configure
        env:
          VCPKG_BINARY_SOURCES: clear
        run: cmake -S . --preset=ALL
      - name: vcpkg logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-Content build/vcpkg-manifest-install.log -ErrorAction SilentlyContinue | Select-Object -Last 120
          Get-ChildItem -Recurse vcpkg/buildtrees -Include *-err.log,*-out.log -ErrorAction SilentlyContinue | ForEach-Object { "=== $($_.FullName)"; Get-Content $_ | Select-Object -Last 40 }
      - name: Build
        run: cmake --build build --config Release
      - name: List outputs
        run: Get-ChildItem -Recurse build -Include *.dll,*.pdb | Select-Object FullName,Length
      - uses: actions/upload-artifact@v4
        with:
          name: dTryHitStop
          path: |
            build/**/Release/*.dll
            build/**/Release/*.pdb
            build/**/release/*.dll
            build/**/release/*.pdb
          if-no-files-found: error
